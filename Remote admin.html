<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cricket Admin Controller</title>
    <style>
        :root {
            --white: #ffffff; --text-dark: #1e293b; --text-muted: #64748b;
            --bg-color: #f0f2f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; }
        
        body { background-color: #e2e8f0; padding: 40px 30px; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh;}
        
        .control-panel { background: #ffffff; padding: 35px; border-radius: 12px; width: 100%; max-width: 1450px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-wrap: wrap; gap: 25px; }
        
        /* UI TABS */
        .control-tabs { width: 100%; display: flex; gap: 15px; border-bottom: 3px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 5px; }
        .tab-btn { background: #cbd5e1; color: var(--text-dark); padding: 15px 30px; font-size: 20px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { background: #94a3b8; }
        .tab-btn.active { background: #2563eb; color: white; }
        .tab-content { display: none; width: 100%; flex-wrap: wrap; gap: 25px; }
        .tab-content.active-tab { display: flex; }

        .control-section { flex: 1; min-width: 400px; background: var(--bg-color); padding: 20px; border-radius: 8px; }
        .control-section.full-width { flex: 100%; display: flex; gap: 25px; background: transparent; padding: 0; }
        h3 { font-size: 22px; color: var(--text-dark); margin-bottom: 15px; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .input-row { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; flex-wrap: wrap;}
        .input-label { width: 110px; font-weight: 700; font-size: 16px; color: var(--text-muted); }
        button { padding: 12px 18px; border: none; border-radius: 6px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; background: #cbd5e1; color: var(--text-dark); min-width: 45px; }
        button:hover { background: #94a3b8; }
        .btn-run { background: #e0e7ff; color: #4338ca; }
        .btn-boundary { background: #dbeafe; color: #1d4ed8; }
        .btn-wicket { background: #fee2e2; color: #b91c1c; }
        .btn-extra { background: #fef9c3; color: #a16207; }
        .btn-danger { background: #ef4444; color: white; margin-top: 15px; }
        .btn-action { background: #10b981; color: white; }
        
        .director-panel { background: #1e293b; padding: 20px; border-radius: 10px; width: 100%; display: flex; gap: 15px; align-items: center; color: white; flex-wrap: wrap;}
        .director-panel strong { font-size: 22px; margin-right: 20px; }
        .director-btn { background: #334155; color: white; padding: 15px 25px; font-size: 18px; border: 2px solid transparent; border-radius: 8px; }
        .director-btn:hover { background: #475569; }
        .director-btn.active { border-color: #3b82f6; background: #1e3a8a; }

        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; width: 100%; }
        .config-box { background: white; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1; width: 100%; }
        .config-box label { display: block; font-size: 15px; margin-bottom: 6px; font-weight: 700; color: var(--text-dark); }
        .config-box input[type="text"], .config-box select, .config-box input[type="number"] { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; margin-bottom: 12px; }
        .list-container { flex: 1; background: var(--bg-color); padding: 20px; border-radius: 8px; height: 500px; overflow-y: auto; border: 1px solid #cbd5e1; }
        .lineup-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #cbd5e1; }
        .lineup-input { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-weight: 600; }
        .reorder-btns { display: flex; flex-direction: column; gap: 4px; }
        .reorder-btns button { padding: 4px 8px; font-size: 12px; line-height: 1; min-width: auto; background: #94a3b8; color: white; border-radius: 4px; }
        
        .modal-overlay { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: rgba(0,0,0,0.85); 
            z-index: 5000; justify-content: center; align-items: center; 
        }
        .modal { background: white; padding: 40px; border-radius: 12px; width: 500px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .modal h2 { margin-top: 0; color: var(--text-dark); border-bottom: 2px solid #cbd5e1; padding-bottom: 15px; font-size: 28px; }
        .modal label { font-size: 18px; font-weight: 700; color: var(--text-dark); }
        .modal p { font-size: 18px; color: var(--text-muted); margin: 0; }
        .modal select, .modal input { padding: 15px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 18px; width: 100%; font-weight: 600; }
        .modal button { background: #10b981; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="control-panel">
        <!-- BROADCAST DIRECTOR PANEL -->
        <div class="director-panel">
            <strong>DIRECTOR SWITCHER:</strong>
            <button class="director-btn" id="btn-scorebug" onclick="toggleGraphic('scorebug')">Scorebug</button>
            <button class="director-btn" id="btn-batting" onclick="toggleGraphic('batting')">Batting Summary</button>
            <button class="director-btn" id="btn-bowling" onclick="toggleGraphic('bowling')">Bowling Summary</button>
            <button class="director-btn" id="btn-match" onclick="toggleGraphic('match')">Match Summary</button>
            <button class="director-btn active" id="btn-none" onclick="toggleGraphic('none')" style="background:#b91c1c; margin-left: auto;">HIDE ALL</button>
        </div>

        <!-- UI TABS -->
        <div class="control-tabs">
            <button class="tab-btn active" id="tab-btn-setup" onclick="switchTab('setup')">Toss & Match Setup</button>
            <button class="tab-btn" id="tab-btn-lineups" onclick="switchTab('lineups')">Team Config & Lineups</button>
            <button class="tab-btn" id="tab-btn-scoring" onclick="switchTab('scoring')">Match Scoring</button>
        </div>

        <!-- TAB 1: TOSS & SETUP -->
        <div id="tab-setup" class="tab-content active-tab">
            <div class="control-section full-width" style="flex-direction: column;">
                <h3>Match Initialization</h3>
                <div class="config-grid" style="grid-template-columns: 1fr;">
                    <div class="config-box">
                        <label style="font-size: 16px; margin-bottom: 10px;">Match Details</label>
                        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                            <div style="flex: 1;">
                                <label>Total Overs per Innings:</label>
                                <input type="number" id="total-overs-input" value="20" min="1" max="50">
                            </div>
                            <div style="flex: 2;">
                                <label>Match Name:</label>
                                <input type="text" id="match-name-input" value="1st T20I">
                            </div>
                            <div style="flex: 2;">
                                <label>Venue (Stadium):</label>
                                <input type="text" id="venue-input" value="Wankhede Stadium">
                            </div>
                        </div>
                        
                        <label style="font-size: 16px; margin-bottom: 10px; border-top: 1px solid #ccc; padding-top: 15px;">Toss Details</label>
                        <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                            <div>
                                <label>Toss Won By:</label>
                                <select id="toss-won-input">
                                    <option value="team1">Team 1</option>
                                    <option value="team2">Team 2</option>
                                </select>
                            </div>
                            <div>
                                <label>Elected To:</label>
                                <select id="toss-decision-input">
                                    <option value="Bat">Bat</option>
                                    <option value="Bowl">Bowl</option>
                                </select>
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 15px;">
                            <button class="btn-action" onclick="submitSetup()" style="font-size: 18px; padding: 15px 30px;">Save Match & Toss Setup</button>
                            <button class="btn-danger" onclick="resetInnings()" style="margin-top: 0; background: #b91c1c;">Reset Entire Match</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: LINEUPS -->
        <div id="tab-lineups" class="tab-content">
            <div class="control-section full-width" style="flex-direction: column;">
                
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; margin-bottom: 15px;">
                    <div class="control-tabs" style="border:none; padding:0; margin:0; width: auto; gap: 10px;">
                        <button class="tab-btn active" id="subtab-btn-setup" onclick="switchSubTab('setup')" style="padding: 10px 20px; font-size: 16px;">Team Details</button>
                        <button class="tab-btn" id="subtab-btn-players" onclick="switchSubTab('players')" style="padding: 10px 20px; font-size: 16px;">Lineups</button>
                    </div>
                    <div style="display: flex; gap: 15px;">
                        <button class="btn-action" onclick="saveTeamConfig()" style="font-size: 16px; padding: 10px 20px;">Save Team Config</button>
                        <button class="btn-danger" onclick="resetTeamConfig()" style="margin-top: 0; font-size: 16px; padding: 10px 20px;">Reset Teams</button>
                    </div>
                </div>

                <!-- Sub-Tab 1: Details -->
                <div id="subtab-setup" style="display: flex; flex-direction: column; width: 100%;">
                    <div class="config-grid" style="margin-bottom: 0;">
                        <div class="config-box">
                            <h3 style="border:none; margin:0; padding:0;">Team 1 Details</h3>
                            <label style="margin-top: 10px;">Full Name</label><input type="text" id="t1-full" value="INDIA">
                            <label>Short Name</label><input type="text" id="t1-short" value="IND">
                            <div style="display: flex; gap: 10px;">
                                <div style="flex:1"><label>Theme Color</label><input type="color" id="t1-color" value="#142168" style="padding:0; height: 40px;"></div>
                                <div style="flex:2"><label>Logo (PNG/JPG)</label><input type="file" id="t1-logo" accept="image/png, image/jpeg" onchange="loadLogo(event, 'team1')" style="padding:5px;"></div>
                            </div>
                        </div>
                        <div class="config-box">
                            <h3 style="border:none; margin:0; padding:0;">Team 2 Details</h3>
                            <label style="margin-top: 10px;">Full Name</label><input type="text" id="t2-full" value="BANGLADESH">
                            <label>Short Name</label><input type="text" id="t2-short" value="BAN">
                            <div style="display: flex; gap: 10px;">
                                <div style="flex:1"><label>Theme Color</label><input type="color" id="t2-color" value="#006a4e" style="padding:0; height: 40px;"></div>
                                <div style="flex:2"><label>Logo (PNG/JPG)</label><input type="file" id="t2-logo" accept="image/png, image/jpeg" onchange="loadLogo(event, 'team2')" style="padding:5px;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sub-Tab 2: Lineups -->
                <div id="subtab-players" style="display: none; gap: 25px; width: 100%;">
                    <div class="list-container" style="flex: 1;"><h3 id="lineup-h-1">Team 1 Lineup</h3><div id="team1-list"></div></div>
                    <div class="list-container" style="flex: 1;"><h3 id="lineup-h-2">Team 2 Lineup</h3><div id="team2-list"></div></div>
                </div>
            </div>
        </div>

        <!-- TAB 3: SCORING -->
        <div id="tab-scoring" class="tab-content">
            <div class="control-section">
                <h3>Match Input 
                    <div><button class="btn-action" onclick="showOpenersModal()">Select Active Players</button> <button class="btn-action" onclick="startSecondInnings()" style="background:#2563eb;">Start 2nd Innings</button></div>
                </h3>
                <div class="input-row"><span class="input-label">Runs:</span><button class="btn-run" onclick="addEvent('run', 0)">0</button><button class="btn-run" onclick="addEvent('run', 1)">1</button><button class="btn-run" onclick="addEvent('run', 2)">2</button><button class="btn-run" onclick="addEvent('run', 3)">3</button><button class="btn-boundary" onclick="addEvent('run', 4)">4</button><button class="btn-run" onclick="addEvent('run', 5)">5</button><button class="btn-boundary" onclick="addEvent('run', 6)">6</button></div>
                <div class="input-row"><span class="input-label">Wides:</span><button class="btn-extra" onclick="addEvent('wide', 0)">W</button><button class="btn-extra" onclick="addEvent('wide', 1)">W+1</button><button class="btn-extra" onclick="addEvent('wide', 2)">W+2</button><button class="btn-extra" onclick="addEvent('wide', 3)">W+3</button><button class="btn-extra" onclick="addEvent('wide', 4)">W+4</button></div>
                <div class="input-row"><span class="input-label">No Balls:</span><button class="btn-extra" onclick="addEvent('noball', 0)">NB</button><button class="btn-extra" onclick="addEvent('noball', 1)">NB+1</button><button class="btn-extra" onclick="addEvent('noball', 2)">NB+2</button><button class="btn-extra" onclick="addEvent('noball', 3)">NB+3</button><button class="btn-extra" onclick="addEvent('noball', 4)">NB+4</button><button class="btn-extra" onclick="addEvent('noball', 6)">NB+6</button></div>
                <div class="input-row"><span class="input-label">Leg Byes:</span><button class="btn-extra" onclick="addEvent('legbye', 1)">LB 1</button><button class="btn-extra" onclick="addEvent('legbye', 2)">LB 2</button><button class="btn-extra" onclick="addEvent('legbye', 3)">LB 3</button><button class="btn-extra" onclick="addEvent('legbye', 4)">LB 4</button></div>
                <div class="input-row"><span class="input-label">Byes:</span><button class="btn-extra" onclick="addEvent('bye', 1)">B 1</button><button class="btn-extra" onclick="addEvent('bye', 2)">B 2</button><button class="btn-extra" onclick="addEvent('bye', 3)">B 3</button><button class="btn-extra" onclick="addEvent('bye', 4)">B 4</button></div>
                <div class="input-row" style="margin-top: 25px;"><span class="input-label">Actions:</span><button class="btn-wicket" onclick="triggerWicket()">WICKET (OUT)</button><button onclick="swapStrike()">Swap Strike</button><button onclick="undoLastBall()">Undo Last</button></div>
            </div>

            <div class="control-section">
                <h3>Bottom Bar Control</h3>
                <div class="config-box" style="margin-bottom: 10px;">
                    <div style="display: flex; gap: 15px; margin-top: 15px; flex-direction: column;">
                        <div><label>Left Zone</label><select id="bb-left-sel" onchange="updateBottomBar()"><option value="crr">Current Run Rate</option><option value="rrr">Required Run Rate</option><option value="proj">Projected Score</option><option value="boundaries">Innings 4s & 6s</option></select></div>
                        <div><label>Center Zone</label><select id="bb-center-sel" onchange="updateBottomBar()"><option value="equation">Match Equation</option><option value="innings">Innings Status</option><option value="toss">Toss Info</option><option value="custom">Custom Text</option></select><input type="text" id="bb-custom-text" placeholder="Type custom text here..." oninput="updateBottomBar()"></div>
                        <div><label>Right Zone</label><select id="bb-right-sel" onchange="updateBottomBar()"><option value="extras">Total Extras</option><option value="lastover">Last Over Runs</option><option value="target">Target Score</option></select></div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

    <!-- MODALS -->
    <div class="modal-overlay" id="modal-openers">
        <div class="modal">
            <h2>Select Active Players</h2>
            <label>Striker</label><select id="opener-striker"></select>
            <label>Non-Striker</label><select id="opener-nonstriker"></select>
            <label>Bowler</label><select id="opener-bowler"></select>
            <button onclick="processOpeners()">Confirm Players</button>
        </div>
    </div>
    <div class="modal-overlay" id="modal-wicket">
        <div class="modal">
            <h2>Wicket Details</h2>
            <label>How Out?</label><select id="wicket-type"><option value="Bowled">Bowled</option><option value="Caught">Caught</option><option value="Run Out">Run Out</option><option value="LBW">LBW</option><option value="Stumped">Stumped</option><option value="Hit Wicket">Hit Wicket</option></select>
            <label>Fielder (Optional)</label><input type="text" id="wicket-fielder" placeholder="e.g., V Kohli">
            <label>Next Batter In</label><select id="next-batter-select"></select>
            <button onclick="processWicket()">Confirm Wicket & Next Batter</button>
        </div>
    </div>
    <div class="modal-overlay" id="modal-bowler">
        <div class="modal">
            <h2>End of Over</h2><p>Select the bowler for the next over.</p>
            <select id="next-bowler-select"></select><button onclick="processNextBowler()">Start Next Over</button>
        </div>
    </div>

    <!-- Firebase CDN SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-database-compat.min.js"></script>

    <script>
        // === REPLACE THIS CONFIG WITH YOUR FIREBASE CONFIG ===
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);

        function createPlayer(name) { return { name: name, runs: 0, balls: 0, isOut: false, dismissal: "", runsConceded: 0, wickets: 0, ballsBowled: 0, dotBalls: 0 }; }
        
        let matchState = {
            activeGraphic: 'none',
            innings: 1, target: null, 
            totalOvers: 20, matchName: "1st T20I", venue: "Wankhede Stadium",
            toss: { won: 'team1', decision: 'Bat' },
            firstInningsBattingTeam: 'team1', firstInningsBowlingTeam: 'team2',
            team1: { full: "INDIA", short: "IND", color: "#142168", logo: "" },
            team2: { full: "BANGLADESH", short: "BAN", color: "#006a4e", logo: "" },
            firstInningsData: null, 
            current: { totalRuns: 0, wickets: 0, totalBalls: 0, extras: { w: 0, nb: 0, lb: 0, b: 0, total: 0 }, overSequence: [], lastOverRuns: 0, team4s: 0, team6s: 0 },
            players: {
                team1: [createPlayer("S Verma"), createPlayer("S Mandhana"), createPlayer("R Ghosh"), createPlayer("H Kaur"), createPlayer("D Sharma"), createPlayer("Batter 6"), createPlayer("Batter 7"), createPlayer("Batter 8"), createPlayer("Batter 9"), createPlayer("Batter 10"), createPlayer("Batter 11")],
                team2: [createPlayer("J Alam"), createPlayer("M Akter"), createPlayer("N Akter"), createPlayer("S Khatun"), createPlayer("Bowler 5"), createPlayer("Bowler 6"), createPlayer("Bowler 7"), createPlayer("Bowler 8"), createPlayer("Bowler 9"), createPlayer("Bowler 10"), createPlayer("Bowler 11")]
            },
            active: { strikerIdx: 0, nonStrikerIdx: 1, bowlerIdx: 0 },
            bottomBar: { left: 'crr', center: 'equation', right: 'extras', customText: '' }
        };

        let historyStack = [];
        
        // Pushes all logic to Firebase so vMix overlay reacts instantly
        function syncToFirebase() {
            firebase.database().ref('cricketMatch').set(matchState);
        }

        function getBattingTeamKey() { return matchState.innings === 1 ? matchState.firstInningsBattingTeam : matchState.firstInningsBowlingTeam; }
        function getBowlingTeamKey() { return matchState.innings === 1 ? matchState.firstInningsBowlingTeam : matchState.firstInningsBattingTeam; }
        function saveHistory() { historyStack.push(JSON.stringify(matchState)); if(historyStack.length > 5) historyStack.shift(); }

        // --- TAB SWITCHERS ---
        function switchTab(tab) {
            ['setup', 'lineups', 'scoring'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active-tab');
                document.getElementById(`tab-btn-${t}`).classList.remove('active');
            });
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
            document.getElementById(`tab-btn-${tab}`).classList.add('active');
        }

        function switchSubTab(subtab) {
            document.getElementById('subtab-setup').style.display = 'none';
            document.getElementById('subtab-players').style.display = 'none';
            document.getElementById('subtab-btn-setup').classList.remove('active');
            document.getElementById('subtab-btn-players').classList.remove('active');
            if(subtab === 'setup') {
                document.getElementById('subtab-setup').style.display = 'flex';
                document.getElementById('subtab-btn-setup').classList.add('active');
            } else {
                document.getElementById('subtab-players').style.display = 'flex';
                document.getElementById('subtab-btn-players').classList.add('active');
            }
        }

        function toggleGraphic(type) {
            matchState.activeGraphic = type;
            ['scorebug', 'batting', 'bowling', 'match', 'none'].forEach(g => { document.getElementById(`btn-${g}`).classList.remove('active'); });
            document.getElementById(`btn-${type}`).classList.add('active');
            syncToFirebase();
        }

        function updateBottomBar() {
            matchState.bottomBar.left = document.getElementById('bb-left-sel').value;
            matchState.bottomBar.center = document.getElementById('bb-center-sel').value;
            matchState.bottomBar.right = document.getElementById('bb-right-sel').value;
            matchState.bottomBar.customText = document.getElementById('bb-custom-text').value;
            syncToFirebase();
        }

        function submitSetup() {
            matchState.totalOvers = parseInt(document.getElementById('total-overs-input').value) || 20;
            matchState.matchName = document.getElementById('match-name-input').value;
            matchState.venue = document.getElementById('venue-input').value;
            matchState.toss.won = document.getElementById('toss-won-input').value;
            matchState.toss.decision = document.getElementById('toss-decision-input').value;
            
            if (matchState.toss.won === 'team1') {
                matchState.firstInningsBattingTeam = matchState.toss.decision === 'Bat' ? 'team1' : 'team2';
                matchState.firstInningsBowlingTeam = matchState.toss.decision === 'Bat' ? 'team2' : 'team1';
            } else {
                matchState.firstInningsBattingTeam = matchState.toss.decision === 'Bat' ? 'team2' : 'team1';
                matchState.firstInningsBowlingTeam = matchState.toss.decision === 'Bat' ? 'team1' : 'team2';
            }
            
            syncToFirebase();
            renderLineups(); 
            alert("Match & Toss Setup Saved Successfully!");
        }

        function saveTeamConfig() {
            matchState.team1.full = document.getElementById('t1-full').value; 
            matchState.team1.short = document.getElementById('t1-short').value; 
            matchState.team1.color = document.getElementById('t1-color').value;
            matchState.team2.full = document.getElementById('t2-full').value; 
            matchState.team2.short = document.getElementById('t2-short').value; 
            matchState.team2.color = document.getElementById('t2-color').value;
            
            document.getElementById('toss-won-input').options[0].text = matchState.team1.full || "Team 1";
            document.getElementById('toss-won-input').options[1].text = matchState.team2.full || "Team 2";

            syncToFirebase(); 
            renderLineups();
            alert("Team Configurations & Lineups Saved Successfully!");
        }

        function resetTeamConfig() {
            if(confirm("Are you sure you want to reset Team Names, Colors, and Lineups to default?")) {
                document.getElementById('t1-full').value = "INDIA"; document.getElementById('t1-short').value = "IND"; document.getElementById('t1-color').value = "#142168";
                document.getElementById('t2-full').value = "BANGLADESH"; document.getElementById('t2-short').value = "BAN"; document.getElementById('t2-color').value = "#006a4e";
                
                matchState.players.team1 = [createPlayer("S Verma"), createPlayer("S Mandhana"), createPlayer("R Ghosh"), createPlayer("H Kaur"), createPlayer("D Sharma"), createPlayer("Batter 6"), createPlayer("Batter 7"), createPlayer("Batter 8"), createPlayer("Batter 9"), createPlayer("Batter 10"), createPlayer("Batter 11")];
                matchState.players.team2 = [createPlayer("J Alam"), createPlayer("M Akter"), createPlayer("N Akter"), createPlayer("S Khatun"), createPlayer("Bowler 5"), createPlayer("Bowler 6"), createPlayer("Bowler 7"), createPlayer("Bowler 8"), createPlayer("Bowler 9"), createPlayer("Bowler 10"), createPlayer("Bowler 11")];
                
                saveTeamConfig(); 
            }
        }
        
        function loadLogo(event, teamKey) {
            const file = event.target.files[0];
            if (file) { 
                // Keep logos extremely small for real-time Firebase sync
                const reader = new FileReader(); 
                reader.onload = function(e) { matchState[teamKey].logo = e.target.result; syncToFirebase(); }; 
                reader.readAsDataURL(file); 
            }
        }

        function updatePlayerName(teamKey, index, newName) { 
            if(newName.trim() !== "") matchState.players[teamKey][index].name = newName; 
            syncToFirebase(); 
        }

        function movePlayer(teamKey, index, dir) {
            let arr = matchState.players[teamKey];
            if (index + dir < 0 || index + dir >= arr.length) return;
            let temp = arr[index]; arr[index] = arr[index + dir]; arr[index + dir] = temp;
            
            let roles = ['strikerIdx', 'nonStrikerIdx', 'bowlerIdx']; let batTeam = getBattingTeamKey(); let bowlTeam = getBowlingTeamKey();
            roles.forEach(role => { let activeTeam = (role === 'bowlerIdx') ? bowlTeam : batTeam; if (teamKey === activeTeam) { if (matchState.active[role] === index) { matchState.active[role] = index + dir; } else if (matchState.active[role] === index + dir) { matchState.active[role] = index; } } });
            
            syncToFirebase(); renderLineups();
        }
        
        function showOpenersModal() {
            const strikerSel = document.getElementById('opener-striker'); const nonstrikerSel = document.getElementById('opener-nonstriker'); const bowlerSel = document.getElementById('opener-bowler');
            strikerSel.innerHTML = ""; nonstrikerSel.innerHTML = ""; bowlerSel.innerHTML = "";
            let batTeam = matchState.players[getBattingTeamKey()]; let bowlTeam = matchState.players[getBowlingTeamKey()];
            batTeam.forEach((p, idx) => { if(!p.isOut) { strikerSel.innerHTML += `<option value="${idx}" ${matchState.active.strikerIdx === idx ? 'selected' : ''}>${p.name}</option>`; nonstrikerSel.innerHTML += `<option value="${idx}" ${matchState.active.nonStrikerIdx === idx ? 'selected' : ''}>${p.name}</option>`; } });
            bowlTeam.forEach((p, idx) => { bowlerSel.innerHTML += `<option value="${idx}" ${matchState.active.bowlerIdx === idx ? 'selected' : ''}>${p.name}</option>`; });
            document.getElementById('modal-openers').style.display = 'flex';
        }
        
        function processOpeners() {
            let sIdx = parseInt(document.getElementById('opener-striker').value); let nsIdx = parseInt(document.getElementById('opener-nonstriker').value); let bIdx = parseInt(document.getElementById('opener-bowler').value);
            if(sIdx === nsIdx) { alert("Striker and Non-Striker cannot be the same player."); return; }
            matchState.active.strikerIdx = sIdx; matchState.active.nonStrikerIdx = nsIdx; matchState.active.bowlerIdx = bIdx;
            document.getElementById('modal-openers').style.display = 'none'; syncToFirebase();
        }
        
        function swapStrike() { const temp = matchState.active.strikerIdx; matchState.active.strikerIdx = matchState.active.nonStrikerIdx; matchState.active.nonStrikerIdx = temp; syncToFirebase(); }
        
        function addEvent(type, runs) {
            if (matchState.current.totalBalls >= matchState.totalOvers * 6) return alert("Innings over limit reached.");
            if (matchState.innings === 2 && matchState.current.totalRuns >= matchState.target) return alert("Match won!");
            if (matchState.current.wickets >= 10) return alert("All out!");
            saveHistory();
            let striker = matchState.players[getBattingTeamKey()][matchState.active.strikerIdx]; let bowler = matchState.players[getBowlingTeamKey()][matchState.active.bowlerIdx];
            let totalRuns = 0; let isLegal = true; let overStr = "";
            
            if (type === 'run') { 
                totalRuns = runs; striker.runs += runs; 
                if(runs===4) matchState.current.team4s++; if(runs===6) matchState.current.team6s++; 
                if(runs===0) bowler.dotBalls++;
                overStr = runs === 0 ? '•' : runs.toString(); 
            } 
            else if (type === 'wide') { isLegal = false; totalRuns = 1 + runs; matchState.current.extras.w += totalRuns; overStr = runs === 0 ? 'Wd' : `${totalRuns}Wd`; }
            else if (type === 'noball') { isLegal = false; totalRuns = 1 + runs; matchState.current.extras.nb += 1; striker.runs += runs; if(runs===4) matchState.current.team4s++; if(runs===6) matchState.current.team6s++; overStr = runs === 0 ? 'Nb' : `${runs}Nb`; }
            else if (type === 'legbye' || type === 'bye') { 
                totalRuns = runs; 
                if(type === 'legbye') matchState.current.extras.lb += runs; if(type === 'bye') matchState.current.extras.b += runs; 
                bowler.dotBalls++; 
                overStr = `${runs}${type === 'legbye' ? 'Lb' : 'B'}`; 
            }
            
            matchState.current.totalRuns += totalRuns; matchState.current.extras.total = matchState.current.extras.w + matchState.current.extras.nb + matchState.current.extras.lb + matchState.current.extras.b;
            bowler.runsConceded += totalRuns; if (type === 'legbye' || type === 'bye') bowler.runsConceded -= runs;
            striker.balls += 1; if (isLegal) { matchState.current.totalBalls += 1; bowler.ballsBowled += 1; }
            matchState.current.overSequence.push(overStr);
            if (type === 'run' || type === 'noball' || type === 'legbye' || type === 'bye') { if (runs % 2 !== 0) swapStrike(); }
            
            if (isLegal && matchState.current.totalBalls > 0 && matchState.current.totalBalls % 6 === 0) {
                matchState.current.lastOverRuns = matchState.current.overSequence.reduce((acc, val) => { if(val === '•' || val === 'W') return acc; return acc + parseInt(val.replace(/\D/g, '') || 1); }, 0);
                swapStrike(); syncToFirebase(); showBowlerModal();
            } else { syncToFirebase(); }
        }
        
        function triggerWicket() {
            if (matchState.current.totalBalls >= matchState.totalOvers * 6 || matchState.current.wickets >= 10) return;
            const sel = document.getElementById('next-batter-select'); sel.innerHTML = "";
            matchState.players[getBattingTeamKey()].forEach((p, idx) => { if (!p.isOut && idx !== matchState.active.strikerIdx && idx !== matchState.active.nonStrikerIdx) sel.innerHTML += `<option value="${idx}">${p.name}</option>`; });
            document.getElementById('modal-wicket').style.display = 'flex';
        }
        
        function processWicket() {
            saveHistory(); document.getElementById('modal-wicket').style.display = 'none';
            let wType = document.getElementById('wicket-type').value; let wFielder = document.getElementById('wicket-fielder').value; let nextBatterIdx = parseInt(document.getElementById('next-batter-select').value);
            let striker = matchState.players[getBattingTeamKey()][matchState.active.strikerIdx]; let bowler = matchState.players[getBowlingTeamKey()][matchState.active.bowlerIdx];
            
            matchState.current.wickets += 1; matchState.current.totalBalls += 1; striker.balls += 1; striker.isOut = true; striker.dismissal = `${wType} ${wFielder ? `c ${wFielder}` : ''} b ${bowler.name}`;
            bowler.ballsBowled += 1; 
            
            if(wType !== 'Run Out') bowler.wickets += 1;
            bowler.dotBalls++; 

            matchState.current.overSequence.push('W');
            if(!isNaN(nextBatterIdx)) matchState.active.strikerIdx = nextBatterIdx;
            
            if (matchState.current.totalBalls > 0 && matchState.current.totalBalls % 6 === 0) { swapStrike(); showBowlerModal(); }
            document.getElementById('wicket-fielder').value = ''; 
            syncToFirebase(); updateLineupStatuses(); 
        }
        
        function showBowlerModal() {
            const sel = document.getElementById('next-bowler-select'); sel.innerHTML = "";
            matchState.players[getBowlingTeamKey()].forEach((p, idx) => { if (idx !== matchState.active.bowlerIdx) sel.innerHTML += `<option value="${idx}">${p.name} (${p.wickets}-${p.runsConceded})</option>`; });
            document.getElementById('modal-bowler').style.display = 'flex';
        }
        
        function processNextBowler() { matchState.active.bowlerIdx = parseInt(document.getElementById('next-bowler-select').value); matchState.current.overSequence = []; document.getElementById('modal-bowler').style.display = 'none'; syncToFirebase(); }
        
        function startSecondInnings() {
            if(matchState.innings === 2) return alert("Already in 2nd Innings."); if(!confirm("End 1st Innings and start 2nd Innings? Team roles will swap.")) return;
            
            matchState.firstInningsData = {
                totalRuns: matchState.current.totalRuns, wickets: matchState.current.wickets, totalBalls: matchState.current.totalBalls,
                batTeamObj: JSON.parse(JSON.stringify(getBattingTeamObj())), bowlTeamObj: JSON.parse(JSON.stringify(getBowlingTeamObj())),
                batters: JSON.parse(JSON.stringify(matchState.players[getBattingTeamKey()])), bowlers: JSON.parse(JSON.stringify(matchState.players[getBowlingTeamKey()]))
            };

            matchState.target = matchState.current.totalRuns + 1; matchState.innings = 2;
            matchState.current = { totalRuns: 0, wickets: 0, totalBalls: 0, extras: { w: 0, nb: 0, lb: 0, b: 0, total: 0 }, overSequence: [], lastOverRuns: 0, team4s: 0, team6s: 0 };
            matchState.active = { strikerIdx: 0, nonStrikerIdx: 1, bowlerIdx: 0 }; historyStack = []; 
            
            document.getElementById('bb-left-sel').value = 'rrr'; document.getElementById('bb-center-sel').value = 'equation'; document.getElementById('bb-right-sel').value = 'target';
            updateBottomBar();
            renderLineups(); showOpenersModal();
        }

        function resetInnings() { if(confirm("DANGER! Reset everything to 0?")) { location.reload(); } }

        function renderLineups() {
            const list1 = document.getElementById('team1-list'); const list2 = document.getElementById('team2-list'); list1.innerHTML = ''; list2.innerHTML = '';
            document.getElementById('lineup-h-1').innerText = `${matchState.team1.full} (${matchState.firstInningsBattingTeam === 'team1' ? (matchState.innings===1?'Batting':'Bowling') : (matchState.innings===1?'Bowling':'Batting')}) Lineup`; 
            document.getElementById('lineup-h-2').innerText = `${matchState.team2.full} (${matchState.firstInningsBattingTeam === 'team2' ? (matchState.innings===1?'Batting':'Bowling') : (matchState.innings===1?'Bowling':'Batting')}) Lineup`;
            
            matchState.players.team1.forEach((p, idx) => { list1.innerHTML += `<div class="lineup-row"><div class="reorder-btns"><button onclick="movePlayer('team1', ${idx}, -1)">▲</button><button onclick="movePlayer('team1', ${idx}, 1)">▼</button></div><input type="text" class="lineup-input" value="${p.name}" onchange="updatePlayerName('team1', ${idx}, this.value)">${getBattingTeamKey() === 'team1' ? `<span id="status-team1-${idx}" style="font-size:12px; font-weight: 700; color:${p.isOut?'#b91c1c':'#10b981'}">${p.isOut?'OUT':'NOT OUT'}</span>` : ''}</div>`; });
            matchState.players.team2.forEach((p, idx) => { list2.innerHTML += `<div class="lineup-row"><div class="reorder-btns"><button onclick="movePlayer('team2', ${idx}, -1)">▲</button><button onclick="movePlayer('team2', ${idx}, 1)">▼</button></div><input type="text" class="lineup-input" value="${p.name}" onchange="updatePlayerName('team2', ${idx}, this.value)">${getBattingTeamKey() === 'team2' ? `<span id="status-team2-${idx}" style="font-size:12px; font-weight: 700; color:${p.isOut?'#b91c1c':'#10b981'}">${p.isOut?'OUT':'NOT OUT'}</span>` : ''}</div>`; });
        }

        function updateLineupStatuses() {
            let batKey = getBattingTeamKey();
            matchState.players[batKey].forEach((p, idx) => {
                let badge = document.getElementById(`status-${batKey}-${idx}`);
                if (badge) { badge.innerText = p.isOut ? 'OUT' : 'NOT OUT'; badge.style.color = p.isOut ? '#b91c1c' : '#10b981'; }
            });
        }

        window.onload = function() { 
            document.getElementById('t1-full').value = matchState.team1.full;
            document.getElementById('t1-short').value = matchState.team1.short;
            document.getElementById('t1-color').value = matchState.team1.color;
            document.getElementById('t2-full').value = matchState.team2.full;
            document.getElementById('t2-short').value = matchState.team2.short;
            document.getElementById('t2-color').value = matchState.team2.color;
            
            document.getElementById('toss-won-input').value = matchState.toss.won;
            document.getElementById('toss-decision-input').value = matchState.toss.decision;
            renderLineups();
            
            // Push initial blank state to Firebase
            syncToFirebase();
        };
    </script>
</body>
</html>
